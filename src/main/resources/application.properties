spring.application.name=StockFlow

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/stockflow}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:stockflow}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:stockflow}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
